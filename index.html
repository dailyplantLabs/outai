<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity Remote" />
  <title>Antigravity Mobile Remote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
    }

    /* Fullscreen App Container (Iframe) */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0a0c;
      display: none;
      z-index: 10;
    }

    /* Login & Loading Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0a0a0c;
      z-index: 20;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: #121216;
      border: 1px solid #232329;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(59, 130, 246, 0.18));
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: #34d399;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #26262c;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { font-size: 13.5px; color: #9ca3af; line-height: 1.55; }

    .google-btn {
      margin-top: 22px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      background: #ffffff;
      color: #18181b;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .google-btn:hover { background: #f4f4f5; }
    .google-btn:active { transform: scale(0.98); }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-box {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 12.5px;
      line-height: 1.45;
      text-align: left;
      word-break: keep-all;
    }

    .retry-btn {
      display: none;
      margin-top: 14px;
      width: 100%;
      padding: 11px 16px;
      background: #27272a;
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      cursor: pointer;
    }
    .retry-btn:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <!-- 1. Initial Loading / Splash Screen -->
  <div id="splashScreen" class="overlay" style="display: none;">
    <div class="card">
      <div class="spinner" id="splashSpinner"></div>
      <h1 id="splashTitle">Antigravity Mobile Remote</h1>
      <p id="splashDesc">인증 상태 및 서버 연결을 확인하고 있습니다...</p>
      <div id="splashError" class="error-box"></div>
      <button id="splashRetryBtn" class="retry-btn" onclick="location.reload()">다시 시도</button>
    </div>
  </div>

  <!-- 2. Fixed-Domain Google Login Screen -->
  <div id="loginScreen" class="overlay" style="display: flex;">
    <div class="card">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <h1>Antigravity Mobile Remote</h1>
      <p>스마트폰 원격 제어 시스템입니다.<br/>승인된 Google 계정으로 로그인해 주세요.</p>

      <div id="loginError" class="error-box"></div>

      <button id="googleLoginBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
        <span id="googleBtnText">Google 계정으로 계속하기</span>
      </button>
    </div>
  </div>

  <!-- 3. Fullscreen App Iframe (keeps URL fixed at dailyplantlabs.github.io/outai/) -->
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const GIST_ID = "e1e3631c9797c83f39cb62e8fb2e4df4";
    const _MASKED_CFG = "FFcVEQBmAg4PTBMuPA4AOlQlMl4GZz83Ogw2SR0tRRtWCgEMAiUAUz8bNWFaGSAPDWRFWw8XRBsdMA4ETA4ZD0wTAAAAAAAAXk9PQQhBEx0TDE8GBEgXQR9bFw4ED0tVXQReBRAXFSBJRU0PGUQbFB1MUBUFQBRUHU0GAA4bTAASbwNSBBAAQ1MPCAJZF1hCTEwDXhRJEUQEVA0UBwQaWQgFTBFUQRQEEUsBRRpIBUIOEh0PDn4CGUkTQyYRVltLFFBHHU4GXU1HUl4bRVsPF0EfPBBDUw9WTRRBAV9NQ1NRHlRAG0xGChdOUVlPUkEZQANZQEFXUR8GFk5PBFZCQUNFDwoSTAVEHRAZBAdZLhMPTBMoWDYxMXUqLX0gdDhXCQ==";

    function decodeClientConfig(b64, maskKey) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        out[i] = bin.charCodeAt(i) ^ maskKey.charCodeAt(i % maskKey.length);
      }
      return JSON.parse(new TextDecoder().decode(out));
    }

    const splashScreen = document.getElementById("splashScreen");
    const splashSpinner = document.getElementById("splashSpinner");
    const splashTitle = document.getElementById("splashTitle");
    const splashDesc = document.getElementById("splashDesc");
    const splashError = document.getElementById("splashError");
    const splashRetryBtn = document.getElementById("splashRetryBtn");

    const loginScreen = document.getElementById("loginScreen");
    const loginError = document.getElementById("loginError");
    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const googleBtnText = document.getElementById("googleBtnText");
    const appFrameEl = document.getElementById("appFrame");

    let currentTunnelUrl = null;
    let isFrameLoaded = false;
    let auth = null;

    async function fetchWithTimeout(url, options = {}, timeoutMs = 4500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchGistState() {
      const apiUrl = `https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`;
      const res = await fetchWithTimeout(apiUrl, { cache: "no-store" }, 5000);
      if (!res.ok) throw new Error("게이트웨이 상태 정보를 불러올 수 없습니다.");
      const data = await res.json();
      const files = data.files || {};

      let tunnelUrl = "";

      if (files["public-url.txt"] && files["public-url.txt"].content) {
        const cand = files["public-url.txt"].content.trim();
        if (cand.startsWith("http")) tunnelUrl = cand.replace(/\/$/, "");
      }

      if (!tunnelUrl && files["agy_tunnel_state.json"] && files["agy_tunnel_state.json"].content) {
        try {
          const parsed = JSON.parse(files["agy_tunnel_state.json"].content);
          if (parsed.public_url && parsed.public_url.startsWith("http")) {
            tunnelUrl = parsed.public_url.replace(/\/$/, "");
          }
        } catch (_) {}
      }

      return { tunnelUrl };
    }

    function showSplashError(msg) {
      splashScreen.style.display = "flex";
      loginScreen.style.display = "none";
      splashSpinner.style.display = "none";
      splashTitle.textContent = "서버 연결 실패";
      splashDesc.textContent = "집/사무실 PC의 Antigravity 서버가 켜져 있는지 확인해 주세요.";
      splashError.style.display = "block";
      splashError.textContent = msg;
      splashRetryBtn.style.display = "block";
    }

    async function connectToServerWithToken(idToken, tunnelUrlHint = "") {
      try {
        splashScreen.style.display = "flex";
        loginScreen.style.display = "none";
        splashSpinner.style.display = "block";
        splashTitle.textContent = "서버 연결 중...";
        splashDesc.textContent = "보안 터널을 통해 PC 서버로 진입하고 있습니다.";
        splashError.style.display = "none";
        splashRetryBtn.style.display = "none";

        // Check if returning to a specific URL (e.g. localhost or LAN)
        const params = new URLSearchParams(window.location.search);
        const authReturn = params.get("auth_return");
        if (authReturn && authReturn.startsWith("http")) {
          const sep = authReturn.includes("#") ? "&" : "#";
          window.location.replace(`${authReturn}${sep}firebase_token=${encodeURIComponent(idToken)}`);
          return;
        }

        let targetBase = tunnelUrlHint;
        if (!targetBase) {
          const state = await fetchGistState();
          targetBase = state.tunnelUrl;
        }
        if (!targetBase || !targetBase.startsWith("http")) {
          throw new Error("현재 실행 중인 PC 서버 터널 주소가 없습니다. PC에서 서버를 켜주세요.");
        }
        currentTunnelUrl = targetBase;

        // Pass Firebase ID token via URL hash to the iframe
        const frameUrl = `${targetBase}/#firebase_token=${encodeURIComponent(idToken)}`;

        if (!isFrameLoaded || !appFrameEl.src.startsWith(targetBase)) {
          appFrameEl.src = frameUrl;
          isFrameLoaded = true;
        } else if (appFrameEl.contentWindow) {
          appFrameEl.contentWindow.postMessage({ type: "CC_FIREBASE_TOKEN", token: idToken }, "*");
        }

        // Reveal appFrame once loaded
        appFrameEl.onload = () => {
          setTimeout(() => {
            splashScreen.style.display = "none";
            loginScreen.style.display = "none";
            appFrameEl.style.display = "block";
          }, 200);
        };
      } catch (err) {
        showSplashError(err.message || "서버에 연결할 수 없습니다.");
      }
    }

    // Listen for messages from the embedded app iframe
    window.addEventListener("message", async (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "CC_APP_READY") {
        splashScreen.style.display = "none";
        loginScreen.style.display = "none";
        appFrameEl.style.display = "block";
      } else if (data.type === "CC_LOGOUT") {
        try {
          if (auth) await signOut(auth);
        } catch (e) {
          console.error(e);
        }
        isFrameLoaded = false;
        appFrameEl.src = "about:blank";
        appFrameEl.style.display = "none";
        splashScreen.style.display = "none";
        loginScreen.style.display = "flex";
      } else if (data.type === "CC_NEED_LOGIN") {
        if (auth && auth.currentUser) {
          const freshToken = await auth.currentUser.getIdToken(true);
          if (appFrameEl.contentWindow) {
            appFrameEl.contentWindow.postMessage({ type: "CC_FIREBASE_TOKEN", token: freshToken }, "*");
          }
        } else {
          appFrameEl.style.display = "none";
          splashScreen.style.display = "none";
          loginScreen.style.display = "flex";
        }
      }
    });

    async function bootGateway() {
      try {
        const activeFbConfig = decodeClientConfig(_MASKED_CFG, "outai-gw-v1");
        const app = initializeApp(activeFbConfig);
        auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        // Fallback safety: if onAuthStateChanged takes more than 2.5s, show login screen immediately
        const authTimeout = setTimeout(() => {
          if (!auth.currentUser && appFrameEl.style.display !== "block") {
            splashScreen.style.display = "none";
            loginScreen.style.display = "flex";
          }
        }, 2500);

        onAuthStateChanged(auth, async (fbUser) => {
          clearTimeout(authTimeout);
          if (fbUser) {
            try {
              const idToken = await fbUser.getIdToken();
              await connectToServerWithToken(idToken);
            } catch (err) {
              console.error("Token error:", err);
              splashScreen.style.display = "none";
              loginScreen.style.display = "flex";
            }
          } else {
            // Not logged in -> show Google login screen right here on dailyplantlabs.github.io/outai/
            splashScreen.style.display = "none";
            appFrameEl.style.display = "none";
            loginScreen.style.display = "flex";
          }
        });
      } catch (err) {
        showSplashError(err.message || "초기화 오류가 발생했습니다.");
        return;
      }

      googleLoginBtn.addEventListener("click", async () => {
        loginError.style.display = "none";
        googleLoginBtn.disabled = true;
        googleBtnText.textContent = "Google 인증 창 여는 중...";
        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          const result = await signInWithPopup(auth, provider);
          const idToken = await result.user.getIdToken();
          await connectToServerWithToken(idToken);
        } catch (err) {
          console.error("Google sign-in error:", err);
          loginError.style.display = "block";
          if (err.code === "auth/unauthorized-domain") {
            loginError.textContent = "Firebase 콘솔 → Authentication → Settings → 승인된 도메인에 'dailyplantlabs.github.io'를 추가해 주세요.";
          } else if (err.code === "auth/popup-closed-by-user") {
            loginError.textContent = "로그인 창이 닫혔습니다. 다시 버튼을 눌러 로그인해 주세요.";
          } else {
            loginError.textContent = err.message || "Google 로그인에 실패했습니다.";
          }
        } finally {
          googleLoginBtn.disabled = false;
          googleBtnText.textContent = "Google 계정으로 계속하기";
        }
      });
    }

    function syncGatewayVisualViewport() {
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      if (appFrameEl) {
        appFrameEl.style.height = `${Math.round(h)}px`;
        appFrameEl.style.top = `${Math.round(top)}px`;
        if (appFrameEl.contentWindow) {
          appFrameEl.contentWindow.postMessage({
            type: "CC_VISUAL_VIEWPORT",
            height: Math.round(h),
            offsetTop: Math.round(top)
          }, "*");
        }
      }
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncGatewayVisualViewport);
      window.visualViewport.addEventListener("scroll", syncGatewayVisualViewport);
    }
    window.addEventListener("resize", syncGatewayVisualViewport);

    bootGateway();
  </script>
</body>
</html>
